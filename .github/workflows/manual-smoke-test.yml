name: Manual smoke test

# Live TMDb smoke test. Unlike CI, this WILL hit the real TMDb API, so it only
# ever runs when a human triggers it by hand from the Actions tab
# (workflow_dispatch). It never runs on push, pull request, or a schedule.
#
# Where the data lands depends on the DATABASE_URL secret:
#   - set (Supabase Postgres URL): ingestion writes to Supabase, and init_db
#     creates the schema there on first run. Those rows persist.
#   - absent: ingestion falls back to a throwaway SQLite file created fresh on
#     the runner (init_db builds the schema from scratch). That file lives only
#     for the duration of the run and is discarded when the runner is torn down.
on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check database connection
        # Reports which backend we're about to write to before any ingestion.
        # With DATABASE_URL set to the Supabase URL this prints "Database type:
        # postgres"; without it, "sqlite". The URL and password are never printed.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.ingestion.check_db_connection

      - name: Run live smoke test
        # Hits the live TMDb API and writes the results to the database.
        #   - TMDB_API_KEY: TMDb credential, required for the live pull.
        #   - DATABASE_URL: when set to the Supabase Postgres URL, ingestion
        #     writes to Supabase; when absent it falls back to an ephemeral
        #     SQLite file on the runner.
        # Both secrets are injected for this step only. GitHub masks the values
        # in logs, and the code reads them via os.getenv and never prints them.
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.ingestion.run_smoke_test
