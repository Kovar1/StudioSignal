name: Manual smoke test

# Live TMDb smoke test. Unlike CI, this WILL hit the real TMDb API, so it only
# ever runs when a human triggers it by hand from the Actions tab
# (workflow_dispatch). It never runs on push, pull request, or a schedule.
#
# The ingestion writes to a throwaway SQLite database created fresh on the
# GitHub Actions runner (init_db builds the schema from scratch). That file
# lives only for the duration of this run and is discarded when the runner is
# torn down — nothing is persisted back to the repo or any external store.
on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live smoke test
        # TMDB_API_KEY is read from the repository secret of the same name and
        # injected into the environment for this step only. GitHub masks the
        # value in logs; the code reads it via os.getenv and never prints it.
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m src.ingestion.run_smoke_test
